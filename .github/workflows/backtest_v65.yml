name: ALPHAQUANT V6.5 Gate Ablation
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backtest days (30, 365, 730)"
        required: true
        default: "30"
      end:
        description: "End date YYYY-MM-DD (optional)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: baseline
            g4: "0"
            g6: "0"
          - scenario: no_g4
            g4: "1"
            g6: "0"
          - scenario: no_g6
            g4: "0"
            g6: "1"
          - scenario: no_g4_no_g6
            g4: "1"
            g6: "1"
    env:
      GATE_MODE: PROXY
      ACCOUNT_EQUITY: "1000"
      BASE_RISK: "0.005"
      FEE_PER_SIDE: "0.0005"
      SLIP_PER_SIDE: "0.0002"
      GEOM_MIN_NET_RR: "1.0"
      REGIME_ADAPTIVE: "1"
      SWEEP_LOOKBACK: "13"
      ABLATE_G4: ${{ matrix.g4 }}
      ABLATE_G6: ${{ matrix.g6 }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Verify files and imports
        run: |
          python -m py_compile research_engine.py backtest_v65.py
          python - <<'PYTEST'
          import research_engine as e
          assert all(hasattr(e, n) for n in ('TF15_MS','gate_pipeline','close_fill','regime','ABLATE_G4','ABLATE_G6'))
          print('PASS: independent research engine, G4=',e.ABLATE_G4,'G6=',e.ABLATE_G6)
          PYTEST
      - name: Backtest
        env:
          DAYS: ${{ inputs.days }}
          END: ${{ inputs.end }}
        run: |
          python backtest_v65.py --days "$DAYS" --end "$END" --out bt_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphaquant-v65-${{ matrix.scenario }}
          path: bt_out/
          if-no-files-found: warn
