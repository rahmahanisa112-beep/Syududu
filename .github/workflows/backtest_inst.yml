
name: backtest-inst

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Jumlah hari backtest"
        required: true
        default: "30"
      end:
        description: "Tanggal akhir YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GATE_MODE: PROXY
      ACCOUNT_EQUITY: "1000"
      BASE_RISK: "0.005"
      FEE_PER_SIDE: "0.0005"
      SLIP_PER_SIDE: "0.0002"
      GEOM_MIN_NET_RR: "1.0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install V6.2 from ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ALPHAQUANT_V62_GitHub_Fix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP tidak ditemukan di root repository"
            exit 1
          fi

          mkdir -p /tmp/alphaquant_v62

          unzip -oq "$ZIP" -d /tmp/alphaquant_v62

          SRC="/tmp/alphaquant_v62/ALPHAQUANT_V62_GitHub_Fix"

          for f in signal_bot.py backtest_inst.py requirements.txt; do
            if [ ! -f "$SRC/$f" ]; then
              echo "::error::File $f tidak ditemukan dalam ZIP"
              exit 1
            fi
            cp "$SRC/$f" "./$f"
          done

          echo "ALPHAQUANT V6.2 installed"
          ls -lh signal_bot.py backtest_inst.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile signal_bot.py
          python -m py_compile backtest_inst.py

      - name: Verify engine compatibility
        run: |
          python - <<'PY'
          import signal_bot as bot

          required = [
              "TF15_MS",
              "TF1H_MS",
              "TF4H_MS",
              "gate_pipeline",
              "regime",
              "close_fill",
              "tick_size",
          ]

          for name in required:
              if not hasattr(bot, name):
                  raise RuntimeError(
                      f"V6.2 missing: {name}"
                  )
              print("PASS:", name)

          print("ENGINE V6.2 COMPATIBLE")
          PY

      - name: Run backtest
        shell: bash
        env:
          DAYS: ${{ inputs.days }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail

          python backtest_inst.py \
            --days "$DAYS" \
            --end "$END" \
            --out bt_out

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALPHAQUANT-V62-RESULTS
          path: bt_out/
          if-no-files-found: warn
