name: scan

# V6.0 Golden Pocket 15m: scan tiap candle 15m. Jadwal 15 menit supaya tidak ada candle yang terlewat.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_PAIRS: "150"
          MAX_OPEN: "1"                 # playbook: tidak ada posisi kedua selama posisi pertama aktif
          MAX_LOSSES_PER_DAY: "2"       # playbook: stop harian setelah 2 loss beruntun
          RISK_PER_TRADE: "0.0025"      # 0,25% per trade (contoh di playbook)
          ACCOUNT_EQUITY: "1000"
          FEE_PER_SIDE: "0.0005"
        run: python signal_bot.py

      - name: Commit signal history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals_history.json ]; then git add signals_history.json; fi
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan riwayat."
          else
            git commit -m "Update signal history"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
