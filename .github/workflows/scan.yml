name: Qwen Alpha Core Scanner

on:
  schedule:
    - cron: '0 * * * *' # Scan setiap 1 jam (sesuai timeframe 1H)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Qwen Alpha Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_FOREVER: "0"
        SCAN_INTERVAL: "10"
        ACCOUNT_EQUITY: "50"
        RISK_PER_TRADE: "0.01"
        MAX_OPEN: "1"
        FEE_PER_SIDE: "0.0005"
      run: |
        echo "Memulai siklus scan Qwen Alpha Core..."
        python signal_bot.py

    - name: Save History to Repository
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        if [ -f "history_qwen_alpha.json" ]; then
          echo "Menyimpan history_qwen_alpha.json..."
          git add history_qwen_alpha.json
          git commit -m " Auto-update: Qwen Alpha history" || echo "Tidak ada perubahan."
          git push
        else
          echo "File history belum ada."
        fi
