name: AlphaQuant Scalp 15m Scanner

on:
  schedule:
    - cron: '*/15 * * * *' # Scan setiap 15 menit
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Izin untuk commit history

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run AlphaQuant Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_FOREVER: "0"
        SCAN_INTERVAL: "10"
        TARGET_RR: "3.0"
        RISK_PER_TRADE: "0.01"
        ACCOUNT_EQUITY: "1000"
        MAX_OPEN: "5"
        FEE_PER_SIDE: "0.0005"
        TOP_PAIRS: "50"
      run: |
        echo "Memulai siklus scan Scalp 15m..."
        python signal_bot.py

    - name: Save History to Repository
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        if [ -f "history_scalp.json" ]; then
          echo "Menyimpan history_scalp.json..."
          git add history_scalp.json
          git commit -m " Auto-update: history_scalp.json" || echo "Tidak ada perubahan."
          git push
        else
          echo "File history belum ada."
        fi
