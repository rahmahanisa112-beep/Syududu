name: scan

on:
  schedule:
    - cron: "*/20 * * * *"     # tiap 20 menit, 24 jam penuh
  workflow_dispatch:           # tombol "Run workflow" manual

# Dua run tidak boleh jalan bersamaan
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_PAIRS: "150"
          SMC_MAX_OPEN: "5"
          SMC_MIN_RISK_PCT: "0.004"
          MAX_ACTIVE_SMC_PER_DIRECTION: "3"
          MAX_NEW_SMC_PER_CANDLE: "2"
          # --- BingX auto-execution ---
          # BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          # BINGX_API_SECRET: ${{ secrets.BINGX_API_SECRET }}
          # BINGX_RISK_USDT: "0.30"
          # BINGX_LEVERAGE: "20"
        run: python signal_bot.py

      - name: Commit signal history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals_history.json ]; then git add signals_history.json; fi
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan riwayat."
          else
            git commit -m "Update signal history"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
