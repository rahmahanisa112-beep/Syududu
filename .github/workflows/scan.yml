name: AlphaQuant ICP Scanner & Recap

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy

    - name: Run AlphaQuant ICP Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_FOREVER: "0"
        SCAN_INTERVAL: "10"
        TARGET_RR: "1.5"
        RISK_PER_TRADE: "0.01"
        ACCOUNT_EQUITY: "1000"
        MAX_OPEN: "5"
        FEE_PER_SIDE: "0.0005"
        TOP_PAIRS: "20"
      run: |
        echo "Memulai siklus scan AlphaQuant ICP..."
        python signal_bot.py

    - name: Save History to Repository (Auto-Commit)
      run: |
        # Konfigurasi Git
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Cek apakah file history ada
        if [ -f "history_icp.json" ]; then
          echo "File history ditemukan, menyimpan ke repository..."
          git add history_icp.json
          git commit -m " Auto-update: history_icp.json" || echo "Tidak ada perubahan untuk di-commit."
          git push
        else
          echo "️ File history_icp.json tidak ada (belum ada sinyal). Skip commit."
        fi
