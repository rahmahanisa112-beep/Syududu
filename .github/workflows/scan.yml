name: scan

# V6.1 BTC/USDT PERP (spesifikasi Institutional Alpha Research v1.0). Scan tiap candle 15m.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GATE_MODE: "PROXY"            # STRICT = tanpa data macro/aggressor -> tidak ada sinyal
          MAX_OPEN: "1"                 # spec: tidak ada entry jika posisi strategi masih terbuka
          BASE_RISK: "0.005"            # baseline 0,5% per trade (spec)
          ACCOUNT_EQUITY: "1000"
          FEE_PER_SIDE: "0.0005"
          SLIP_PER_SIDE: "0.0002"
          GEOM_MIN_NET_RR: "1.8"        # spec G7 = 2.0 setelah biaya; lihat catatan
        run: python signal_bot.py

      - name: Commit signal history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals_history.json ]; then git add signals_history.json; fi
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan riwayat."
          else
            git commit -m "Update signal history"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
